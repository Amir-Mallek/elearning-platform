<div class="flex h-screen bg-gray-100">
  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Course Header -->
    @if (course) {
      <div class="bg-white shadow-sm border-b border-gray-200 px-6 py-4">
        <h1 class="text-2xl font-bold text-gray-800">{{ course.title }}</h1>
        <p class="text-gray-600 mt-1 line-clamp-2">{{ course.description }}</p>
      </div>
    }

    <!-- Video Player / Content Area -->
    <div class="flex-1 overflow-y-auto p-6">
      <div class="flex items-start justify-center min-h-full">
        <router-outlet></router-outlet>
      </div>
    </div>

    <!-- Controls Bar -->
    <div class="bg-white border-t border-gray-200 px-6 py-4 shrink-0">
      <div class="flex items-center justify-between max-w-5xl mx-auto">
        <!-- Previous Button -->
        <button
          (click)="goToPreviousItem()"
          [disabled]="!hasPrevious"
          [class.opacity-50]="!hasPrevious"
          [class.cursor-not-allowed]="!hasPrevious"
          class="flex items-center px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors disabled:hover:bg-gray-200"
        >
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
          Previous
        </button>

        <!-- Mark Complete Button -->
        @if (currentItem) {
          @if (isCurrentItemCompleted) {
            <div class="flex items-center text-green-600 font-semibold">
              <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path
                  fill-rule="evenodd"
                  d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                  clip-rule="evenodd"
                ></path>
              </svg>
              Completed
            </div>
          } @else {
            <button
              (click)="markAsComplete()"
              class="flex items-center px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors"
            >
              <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M5 13l4 4L19 7"
                ></path>
              </svg>
              Mark as Complete
            </button>
          }
        }

        <!-- Next Button -->
        <button
          (click)="goToNextItem()"
          [disabled]="!hasNext"
          [class.opacity-50]="!hasNext"
          [class.cursor-not-allowed]="!hasNext"
          class="flex items-center px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors disabled:hover:bg-gray-200"
        >
          Next
          <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            ></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Sidebar -->
  <app-course-sidebar
    [courseItems]="courseItems"
    [lastCompletedIndex]="lastCompletedIndex"
    [currentItemId]="currentItem?.id ?? null"
    [courseTitle]="course?.title ?? ''"
    (itemSelected)="selectItem($event)"
  ></app-course-sidebar>
</div>
