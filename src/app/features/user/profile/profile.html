<section class="profile-card" *ngIf="authService.user() as user">
  <div class="profile-header">
    <img
      class="profile-avatar"
      [src]="user.avatarUrl || '/assets/default.webp'"
      alt="User avatar"
    />
    <div>
      <h1>{{ user.name }}</h1>
      <p>{{ user.email }}</p>
      <span class="role">{{ user.role }}</span>
    </div>
  </div>

  <div class="profile-actions">
    <a routerLink="/profile/edit">Edit profile</a>
    <a routerLink="/profile/password">Change password</a>
  </div>
</section>
