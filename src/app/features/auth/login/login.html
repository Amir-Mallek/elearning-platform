<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="auth-title">Login</h1>
    <p class="auth-subtitle">Welcome back. Sign in to continue learning.</p>

    <label class="auth-label">
      Email
      <input
        class="auth-input"
        type="email"
        formControlName="email"
        placeholder="you@example.com"
      />
    </label>
    @if (form.get('email')?.touched && form.get('email')?.invalid) {
      <p class="auth-error">Enter a valid email address.</p>
    }

    <label class="auth-label">
      Password
      <input
        class="auth-input"
        type="password"
        formControlName="password"
        placeholder="••••••••"
      />
    </label>
    @if (form.get('password')?.touched && form.get('password')?.invalid) {
      <p class="auth-error">Password must be at least 6 characters.</p>
    }

    <button class="auth-button" type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Signing in...' : 'Login' }}
    </button>

    <p class="auth-footer">
      Don't have an account?
      <a routerLink="/register">Create one</a>
    </p>
  </form>
</div>
